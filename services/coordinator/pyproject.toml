# Project file for the coordinator: REST API, blob store, scheduler and round driver.

[project]
name = "tod-coordinator"
version = "0.1.0"
description = "ToD coordinator: REST API, blob store, scheduler, round driver"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "eth-account>=0.13", "jsonschema>=4.23",
                "tod-core", "tod-datasets", "tod-workloads"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
tod-core = { workspace = true }
tod-datasets = { workspace = true }
tod-workloads = { workspace = true }

[tool.uv]
# Runs from this folder (`uv run uvicorn api.app:app`); it only needs packaging once the Docker image wants a wheel
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
