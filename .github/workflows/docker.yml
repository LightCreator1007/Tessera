# Builds the node and verifier images for amd64 and arm64, smoke-tests both, and pushes them from main.
name: docker
on:
  pull_request:
    paths: ["apps/node/**", "apps/verifier/**", "packages/**", "vectors/**", "docker/**", "networks/**", "pyproject.toml", "uv.lock",
            ".python-version", ".dockerignore", ".github/workflows/docker.yml"]
  push:
    branches: [main]
    paths: ["apps/node/**", "apps/verifier/**", "packages/**", "vectors/**", "docker/**", "networks/**", "pyproject.toml", "uv.lock",
            ".python-version", ".dockerignore", ".github/workflows/docker.yml"]
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [node, verifier]
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Job-level `if` can't see files, so this step decides whether the rest runs.
      - id: has
        run: test -f docker/app.Dockerfile && echo "image=yes" >> "$GITHUB_OUTPUT" || echo "No Dockerfile yet, skipping."
      # Free hosted arm64 runners only exist for public repos, so arm64 runs under QEMU.
      - if: steps.has.outputs.image == 'yes'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.has.outputs.image == 'yes'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.has.outputs.image == 'yes'
        name: Build and smoke-test on each arch
        run: |
          for p in linux/amd64 linux/arm64; do
            docker buildx build --platform "$p" --build-arg APP="$APP" -f docker/app.Dockerfile --load -t "tod-$APP:test" .
            docker run --rm --platform "$p" "tod-$APP:test" --version
            # Both apps talk to the chain through the ledger, which can't start without these.
            docker run --rm --platform "$p" --entrypoint python "tod-$APP:test" -c "from tod_core.ledger import _load_abi; _load_abi('IJobMarket'); _load_abi('INodeRegistry'); _load_abi('Competitions')"
            # The app must run as the unprivileged user and still be able to write its data volume.
            docker run --rm --platform "$p" -v tod-ci:/data --entrypoint sh "tod-$APP:test" -c 'test "$(id -u)" = 10001 && touch /data/ok'
            # Mac and Linux laptops train together only if the exact kernel gives the same bytes on both chips.
            if [ "$APP" = node ]; then docker run --rm --platform "$p" "tod-$APP:test" selftest --json; fi
          done
      - if: steps.has.outputs.image == 'yes' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.has.outputs.image == 'yes' && github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lightcreator1007/tod-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/lightcreator1007/tod-${{ matrix.app }}:latest
