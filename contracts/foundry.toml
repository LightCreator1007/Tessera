[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Keep the IR pipeline enabled for the settlement contract build.
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "../vectors" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64

[fmt]
line_length = 120
