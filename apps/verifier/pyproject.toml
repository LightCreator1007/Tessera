# Package for the tod-verifier CLI that replays and checks node work.

[project]
name = "tod-verifier"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["tod-node", "typer>=0.12"]

[project.scripts]
tod-verifier = "tod_verifier.cli:app"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
tod-node = { workspace = true }
