# Package for the tod-node CLI that operators run on their laptops.

[project]
name = "tod-node"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eth-account>=0.13",
    "filelock>=3.12",
    "tod-workloads",
    "typer>=0.12",
]

[project.scripts]
tod-node = "tod_node.cli:app"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
tod-workloads = { workspace = true }
